<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Deep Sea Siege</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #000814;
    overflow: hidden;
    font-family: 'Courier New', monospace;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
    width: 100vw;
  }
  #wrap {
    position: relative;
    width: 700px;
    max-width: 100vw;
    height: 100vh;
    overflow: hidden;
  }
  canvas { display: block; width: 100%; height: 100%; }

  /* HUD */
  #hud {
    position: absolute;
    top: 0; left: 0; right: 0;
    display: flex;
    justify-content: space-between;
    padding: 10px 16px;
    background: rgba(0,8,20,0.8);
    border-bottom: 1px solid rgba(0,200,180,0.2);
    pointer-events: none;
    z-index: 5;
  }
  .hval { color: #00e5cc; font-size: 11px; letter-spacing: 2px; text-shadow: 0 0 8px #00e5cc; }
  .hlbl { color: rgba(0,200,160,0.5); font-size: 7px; letter-spacing: 3px; display: block; margin-bottom: 2px; }

  /* Overlay */
  #ov {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    background: rgba(0,4,14,0.93);
    z-index: 10; padding: 20px;
  }
  #ov.gone { display: none; }
  .ot {
    font-size: 30px; color: #00e5cc;
    text-shadow: 0 0 30px #00e5cc, 0 0 60px #0af;
    margin-bottom: 8px; text-align: center;
    line-height: 1.4; letter-spacing: 4px;
    animation: glow 2s ease-in-out infinite;
  }
  .os { font-size: 10px; color: #0af; margin-bottom: 22px; text-align: center; line-height: 2.2; letter-spacing: 2px; }
  .oh { font-size: 8px; color: #556; margin-bottom: 5px; text-align: center; line-height: 2; letter-spacing: 1px; }
  .legend {
    display: flex; gap: 20px; flex-wrap: wrap;
    justify-content: center; margin: 14px 0;
  }
  .li { font-size: 8px; color: #668; letter-spacing: 1px; }
  .li span { color: #00e5cc; }
  .sbox {
    border: 1px solid rgba(0,200,180,0.25);
    padding: 14px 28px; margin: 12px 0;
    text-align: center; background: rgba(0,20,40,0.8);
  }
  .sbox p { font-size: 9px; color: #888; line-height: 2.2; letter-spacing: 1px; }
  .sbox .big { font-size: 18px; color: #00e5cc; letter-spacing: 3px; }
  .nr { font-size: 9px; color: #0af; animation: glow 1s infinite alternate; margin-top: 6px; }
  #go {
    margin-top: 20px; padding: 13px 36px;
    background: #00e5cc; color: #000814;
    font-family: 'Courier New', monospace;
    font-size: 13px; border: none; cursor: pointer;
    letter-spacing: 3px; font-weight: 700;
    animation: btn 1.8s ease-in-out infinite;
    transition: transform 0.1s;
  }
  #go:hover { background: #00ffee; transform: scale(1.05); }
  #go:active { transform: scale(0.97); }

  /* Mobile */
  #mc {
    display: none; position: absolute;
    bottom: 8px; left: 0; right: 0;
    justify-content: space-between;
    padding: 0 14px; z-index: 5;
  }
  .mb {
    width: 68px; height: 68px;
    background: rgba(0,200,180,0.1);
    border: 1px solid rgba(0,200,180,0.3);
    color: #00e5cc; font-size: 22px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 4px; cursor: pointer;
    user-select: none; touch-action: manipulation;
  }
  .mb:active { background: rgba(0,200,180,0.25); }
  @media (max-width: 700px), (hover: none) { #mc { display: flex; } }

  @keyframes glow {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.65; }
  }
  @keyframes btn {
    0%, 100% { box-shadow: 0 0 0 #00e5cc; }
    50% { box-shadow: 0 0 20px #00e5cc, 0 0 40px #0af; }
  }
</style>
</head>
<body>
<div id="wrap">
  <!-- HUD -->
  <div id="hud">
    <div><span class="hlbl">SCORE</span><span class="hval" id="sc">0</span></div>
    <div style="text-align:center"><span class="hlbl">WAVE</span><span class="hval" id="wv">1</span></div>
    <div style="text-align:center"><span class="hlbl">BEST</span><span class="hval" id="bs">0</span></div>
    <div style="text-align:right"><span class="hlbl">HULL</span><span class="hval" id="lv">♦♦♦</span></div>
  </div>

  <!-- Canvas -->
  <canvas id="c"></canvas>

  <!-- Mobile controls -->
  <div id="mc">
    <div class="mb" id="ml">&#9664;</div>
    <div class="mb" id="mf">&#9650;</div>
    <div class="mb" id="mr">&#9654;</div>
  </div>

  <!-- Overlay -->
  <div id="ov">
    <div class="ot">DEEP SEA<br>SIEGE</div>
    <div class="os">SUBMARINE VS THE ABYSS</div>
    <div class="legend">
      <div class="li"><span>ANGLERFISH</span> 30 pts</div>
      <div class="li"><span>JELLYFISH</span> 20 pts</div>
      <div class="li"><span>CRAB</span> 10 pts</div>
      <div class="li"><span>NAUTILUS</span> BONUS</div>
    </div>
    <div class="oh">ARROW KEYS / WASD &nbsp; MOVE &nbsp;|&nbsp; SPACE / UP &nbsp; FIRE SONAR</div>
    <div class="oh">Coral formations absorb enemy ink — but they won't last forever</div>
    <div class="oh">Destroy all creatures each wave to dive deeper</div>
    <button id="go">DIVE IN</button>
  </div>
</div>

<script>
// =====================================================
//  DEEP SEA SIEGE — Full Game Engine
//  Theme: Bioluminescent deep ocean. Pure canvas art.
//  No images. No emoji. All hand-drawn shapes.
// =====================================================

const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');
const ov     = document.getElementById('ov');
const scEl   = document.getElementById('sc');
const wvEl   = document.getElementById('wv');
const bsEl   = document.getElementById('bs');
const lvEl   = document.getElementById('lv');

let W, H;
function resize() {
  W = Math.min(window.innerWidth, 700);
  H = window.innerHeight;
  canvas.width  = W;
  canvas.height = H;
  document.getElementById('wrap').style.width = W + 'px';
}
resize();
window.addEventListener('resize', () => { resize(); if (state === 'playing') initWave(false); });

// ── State ─────────────────────────────────────
let state = 'idle'; // idle | playing | dead
let score = 0, wave = 1, lives = 3;
let best = parseInt(localStorage.getItem('dss_best') || '0');
let keys = {}, mob = { l: false, r: false, f: false };
let player, bullets, inkBolts, creatures, corals, particles;
let creDir, creSpeed, creShootTimer, frameId, lastT = 0;
let shakePow = 0, waveBanner = null, ufo, ufoTimer;

// ── Bioluminescent background particles ───────
const BG_PARTS = Array.from({ length: 80 }, () => ({
  x: Math.random() * 800, y: Math.random() * 900,
  r: 0.5 + Math.random() * 1.8,
  s: 0.2 + Math.random() * 0.9,
  a: Math.random() * Math.PI * 2,
  vy: 0.04 + Math.random() * 0.12
}));

// ── Drawing: Ocean Background ─────────────────
function drawOceanBg(t) {
  // Layered deep-sea gradient
  const rows = 8;
  const palette = [
    '#000814','#000c1c','#000f24','#001328',
    '#001628','#001220','#000e1c','#000814'
  ];
  palette.forEach((col, i) => {
    ctx.fillStyle = col;
    ctx.fillRect(0, H * i / rows, W, H / rows + 2);
  });

  // Caustic light ripples near surface
  ctx.save();
  for (let i = 0; i < 10; i++) {
    const x = ((t * 0.025 + i * 85) % W);
    const a = 0.03 + 0.02 * Math.sin(t * 0.001 + i);
    ctx.strokeStyle = `rgba(0,160,200,${a})`;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(x, 42);
    ctx.bezierCurveTo(x + 30, 70, x - 20, 100, x + 15, 135);
    ctx.stroke();
  }
  ctx.restore();

  // Floating bioluminescent specks
  BG_PARTS.forEach(p => {
    const flicker = 0.15 + 0.25 * Math.sin(t * 0.0012 + p.a);
    const hue = 160 + 40 * Math.sin(p.a);
    ctx.fillStyle = `rgba(0,${Math.floor(hue + 30)},200,${flicker * p.s})`;
    ctx.beginPath();
    ctx.arc(p.x % W, p.y % H, p.r, 0, Math.PI * 2);
    ctx.fill();
    p.y -= p.vy;
    if (p.y < 0) p.y = H;
  });
}

// ── Drawing: Submarine (player) ───────────────
function drawSub(x, y) {
  ctx.save();
  if (player.inv > 0 && Math.floor(player.inv / 7) % 2 === 0) {
    ctx.globalAlpha = 0.35;
  }
  const t = Date.now();

  // Propeller wash bubbles
  for (let i = 0; i < 3; i++) {
    const bx = x + 28 + Math.sin(t * 0.01 + i * 2) * 4;
    const by = y - 3 + (i - 1) * 7;
    ctx.fillStyle = `rgba(0,180,200,${0.3 - i * 0.08})`;
    ctx.beginPath();
    ctx.arc(bx, by, 3 - i, 0, Math.PI * 2);
    ctx.fill();
  }

  // Main hull
  ctx.fillStyle = '#003a50';
  ctx.beginPath();
  ctx.ellipse(x, y, 30, 14, 0, 0, Math.PI * 2);
  ctx.fill();

  // Hull highlight (top half)
  ctx.fillStyle = '#004d66';
  ctx.beginPath();
  ctx.ellipse(x - 2, y - 3, 22, 8, 0, 0, Math.PI * 2);
  ctx.fill();

  // Pressure rivets
  ctx.fillStyle = '#002233';
  for (let i = -2; i <= 2; i++) {
    ctx.beginPath();
    ctx.arc(x + i * 11, y + 8, 2, 0, Math.PI * 2);
    ctx.fill();
  }

  // Conning tower
  ctx.fillStyle = '#004060';
  ctx.fillRect(x - 8, y - 28, 16, 17);
  // Tower top cap
  ctx.fillStyle = '#005577';
  ctx.beginPath();
  ctx.ellipse(x, y - 28, 8, 4.5, 0, 0, Math.PI * 2);
  ctx.fill();
  // Tower window
  ctx.fillStyle = '#00ccbb';
  ctx.beginPath();
  ctx.arc(x, y - 21, 4, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#001a22';
  ctx.beginPath();
  ctx.arc(x, y - 21, 2.5, 0, Math.PI * 2);
  ctx.fill();
  // Biolum window reflection
  ctx.fillStyle = 'rgba(0,220,200,0.6)';
  ctx.beginPath();
  ctx.arc(x + 1, y - 22, 1, 0, Math.PI * 2);
  ctx.fill();

  // Periscope
  ctx.strokeStyle = '#006688';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(x + 4, y - 28);
  ctx.lineTo(x + 4, y - 42);
  ctx.lineTo(x + 12, y - 42);
  ctx.stroke();
  // Periscope head
  ctx.fillStyle = '#007799';
  ctx.fillRect(x + 9, y - 46, 9, 7);

  // Hull portholes
  const portColors = ['#00ccbb', '#0099aa'];
  [-16, 4, 16].forEach((ox, i) => {
    ctx.fillStyle = portColors[i % 2];
    ctx.beginPath();
    ctx.arc(x + ox, y + 1, 4, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#001a22';
    ctx.beginPath();
    ctx.arc(x + ox, y + 1, 2.5, 0, Math.PI * 2);
    ctx.fill();
  });

  // Propeller
  ctx.save();
  ctx.translate(x + 30, y);
  const spin = t * 0.015;
  for (let i = 0; i < 3; i++) {
    ctx.save();
    ctx.rotate(spin + i * Math.PI * 2 / 3);
    ctx.fillStyle = '#0099aa';
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.bezierCurveTo(2, -9, 7, -11, 9, -7);
    ctx.bezierCurveTo(7, -3, 2, 0, 0, 0);
    ctx.fill();
    ctx.restore();
  }
  ctx.restore();

  // Sonar charge glow on periscope tip
  const charge = 1 - (player.shotCD / 14);
  if (charge > 0.05) {
    ctx.strokeStyle = `rgba(0,220,200,${charge * 0.7})`;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(x + 13, y - 42, 4 + charge * 8, 0, Math.PI * 2);
    ctx.stroke();
  }

  ctx.restore();
}

// ── Drawing: Anglerfish ───────────────────────
function drawAnglerfish(x, y, animT) {
  ctx.save();
  // Main body
  ctx.fillStyle = '#1a0030';
  ctx.beginPath();
  ctx.ellipse(x, y, 23, 17, 0, 0, Math.PI * 2);
  ctx.fill();

  // Dorsal ridge
  ctx.fillStyle = '#280040';
  ctx.beginPath();
  ctx.moveTo(x - 14, y - 12);
  ctx.quadraticCurveTo(x, y - 26, x + 14, y - 12);
  ctx.closePath();
  ctx.fill();
  // Ridge spines
  ctx.strokeStyle = '#440066';
  ctx.lineWidth = 1.5;
  for (let i = 0; i < 4; i++) {
    const sx = x - 9 + i * 6;
    const sh = 6 + (i % 2) * 5;
    ctx.beginPath();
    ctx.moveTo(sx, y - 16);
    ctx.lineTo(sx + (i % 2 ? -2 : 2), y - 16 - sh);
    ctx.stroke();
  }

  // Mouth with serrated teeth
  ctx.fillStyle = '#110020';
  ctx.beginPath();
  ctx.ellipse(x + 10, y + 6, 12, 8, 0.3, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#ddeeff';
  for (let i = 0; i < 5; i++) {
    const tx = x + 1 + i * 4.5;
    ctx.beginPath();
    ctx.moveTo(tx, y + 2);
    ctx.lineTo(tx + 2, y + 9);
    ctx.lineTo(tx + 4, y + 2);
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(tx, y + 14);
    ctx.lineTo(tx + 2, y + 7);
    ctx.lineTo(tx + 4, y + 14);
    ctx.fill();
  }

  // Lure appendage (dangles in front)
  const lureWave = Math.sin(animT * 0.06 + x * 0.1) * 7;
  const lureX = x - 28, lureY = y - 14 + lureWave;
  ctx.strokeStyle = '#550077';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(x - 16, y - 16);
  ctx.quadraticCurveTo(lureX - 5, y - 32, lureX, lureY);
  ctx.stroke();
  // Lure bulb glow
  ctx.fillStyle = '#ff22ff';
  ctx.beginPath();
  ctx.arc(lureX, lureY, 5, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#ffaaff';
  ctx.beginPath();
  ctx.arc(lureX - 1, lureY - 1, 2, 0, Math.PI * 2);
  ctx.fill();

  // Eye (large, menacing)
  ctx.fillStyle = '#ff1166';
  ctx.beginPath();
  ctx.arc(x + 12, y - 4, 6, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#000';
  ctx.beginPath();
  ctx.arc(x + 13, y - 4, 3.5, 0, Math.PI * 2);
  ctx.fill();
  // Eye highlight
  ctx.fillStyle = '#ff88aa';
  ctx.beginPath();
  ctx.arc(x + 14, y - 5.5, 1.2, 0, Math.PI * 2);
  ctx.fill();

  // Body spots (biolum pattern)
  ctx.fillStyle = 'rgba(180,0,255,0.35)';
  ctx.beginPath();
  ctx.arc(x - 6, y + 2, 4, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.arc(x - 14, y - 2, 2.5, 0, Math.PI * 2);
  ctx.fill();

  // Tail fin
  ctx.fillStyle = '#1f0038';
  ctx.beginPath();
  ctx.moveTo(x - 22, y);
  ctx.bezierCurveTo(x - 32, y - 14, x - 38, y - 8, x - 32, y);
  ctx.bezierCurveTo(x - 38, y + 8, x - 32, y + 14, x - 22, y);
  ctx.fill();

  ctx.restore();
}

// ── Drawing: Jellyfish ────────────────────────
function drawJellyfish(x, y, animT) {
  ctx.save();

  // Pulsing bell (scale with animation)
  const pulse = 1 + 0.06 * Math.sin(animT * 0.1);
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(pulse, 1);

  // Outer bell
  ctx.fillStyle = '#0a1a44';
  ctx.beginPath();
  ctx.arc(0, 0, 19, Math.PI, 0);
  ctx.closePath();
  ctx.fill();

  // Inner bell (translucent layer)
  ctx.fillStyle = '#0d2255';
  ctx.beginPath();
  ctx.arc(0, 0, 13, Math.PI, 0);
  ctx.closePath();
  ctx.fill();

  // Bell edge ripple
  ctx.strokeStyle = '#0044aa';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.arc(0, 0, 19, Math.PI, 0);
  ctx.stroke();

  // Biolum organs inside
  ctx.fillStyle = '#0077cc';
  ctx.beginPath();
  ctx.arc(-6, -4, 4, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.arc(6, -4, 4, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#00aaff';
  ctx.beginPath();
  ctx.arc(0, -10, 5, 0, Math.PI * 2);
  ctx.fill();
  // Bright core
  ctx.fillStyle = '#88ddff';
  ctx.beginPath();
  ctx.arc(0, -10, 2, 0, Math.PI * 2);
  ctx.fill();

  ctx.restore(); // end scale

  // Tentacles (8 of them, wavy)
  ctx.strokeStyle = '#0055aa';
  ctx.lineWidth = 1.5;
  for (let i = 0; i < 8; i++) {
    const tx = x - 17 + i * 4.8;
    const waveAmp = 7 + (i % 3) * 3;
    const phaseOffset = i * 0.7;
    ctx.beginPath();
    ctx.moveTo(tx, y);
    ctx.bezierCurveTo(
      tx + Math.sin(animT * 0.06 + phaseOffset) * waveAmp, y + 12,
      tx - Math.sin(animT * 0.06 + phaseOffset) * waveAmp, y + 24,
      tx + Math.sin(animT * 0.06 + phaseOffset) * (waveAmp * 0.5), y + 36
    );
    ctx.stroke();
    // Stinging tips
    ctx.fillStyle = '#0088ff';
    ctx.beginPath();
    ctx.arc(
      tx + Math.sin(animT * 0.06 + phaseOffset) * (waveAmp * 0.5),
      y + 36, 2, 0, Math.PI * 2
    );
    ctx.fill();
  }

  ctx.restore();
}

// ── Drawing: Crab ─────────────────────────────
function drawCrab(x, y, animT) {
  ctx.save();

  // Walking legs (4 pairs, animated)
  ctx.strokeStyle = '#553300';
  ctx.lineWidth = 2;
  for (let i = 0; i < 4; i++) {
    const legX = x - 10 + i * 7;
    const legWave = Math.sin(animT * 0.09 + i * 0.9) * 7;
    // Left side legs
    ctx.beginPath();
    ctx.moveTo(legX, y + 10);
    ctx.lineTo(legX - 8 + legWave, y + 20);
    ctx.lineTo(legX - 12 + legWave, y + 30);
    ctx.stroke();
    // Right side legs
    ctx.beginPath();
    ctx.moveTo(legX, y + 10);
    ctx.lineTo(legX + 8 - legWave, y + 20);
    ctx.lineTo(legX + 12 - legWave, y + 30);
    ctx.stroke();
  }

  // Body (carapace)
  ctx.fillStyle = '#442200';
  ctx.beginPath();
  ctx.ellipse(x, y, 21, 14, 0, 0, Math.PI * 2);
  ctx.fill();

  // Shell ridges
  ctx.strokeStyle = '#5a3300';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.arc(x, y + 2, 15, Math.PI, 0);
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(x, y + 2, 8, Math.PI, 0);
  ctx.stroke();
  // Carapace spots
  ctx.fillStyle = '#663300';
  for (let i = 0; i < 4; i++) {
    ctx.beginPath();
    ctx.arc(x - 9 + i * 6, y - 1, 2, 0, Math.PI * 2);
    ctx.fill();
  }

  // Claws (big, with inner claw)
  const clawWave = Math.sin(animT * 0.07) * 5;
  // LEFT claw
  ctx.save();
  ctx.translate(x - 26, y - 2 - clawWave);
  ctx.rotate(-0.25);
  ctx.fillStyle = '#553300';
  ctx.beginPath();
  ctx.ellipse(0, 0, 12, 7, 0, 0, Math.PI * 2);
  ctx.fill();
  // Inner pincer
  ctx.fillStyle = '#664400';
  ctx.beginPath();
  ctx.ellipse(-9, -5, 6, 4, 0.4, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#884400';
  ctx.beginPath();
  ctx.ellipse(-9, -5, 4, 2.5, 0.4, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  // RIGHT claw
  ctx.save();
  ctx.translate(x + 26, y - 2 + clawWave);
  ctx.rotate(0.25);
  ctx.fillStyle = '#553300';
  ctx.beginPath();
  ctx.ellipse(0, 0, 12, 7, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#664400';
  ctx.beginPath();
  ctx.ellipse(9, -5, 6, 4, -0.4, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#884400';
  ctx.beginPath();
  ctx.ellipse(9, -5, 4, 2.5, -0.4, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  // Eye stalks
  ctx.strokeStyle = '#663300';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(x - 9, y - 12);
  ctx.lineTo(x - 11, y - 23);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(x + 9, y - 12);
  ctx.lineTo(x + 11, y - 23);
  ctx.stroke();
  // Eyes
  ctx.fillStyle = '#ff3300';
  ctx.beginPath();
  ctx.arc(x - 11, y - 24, 5, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.arc(x + 11, y - 24, 5, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#000';
  ctx.beginPath();
  ctx.arc(x - 11, y - 24, 2.5, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.arc(x + 11, y - 24, 2.5, 0, Math.PI * 2);
  ctx.fill();
  // Shine
  ctx.fillStyle = '#ff7755';
  ctx.beginPath();
  ctx.arc(x - 10, y - 25, 1.5, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.arc(x + 12, y - 25, 1.5, 0, Math.PI * 2);
  ctx.fill();

  ctx.restore();
}

// ── Drawing: Nautilus UFO ─────────────────────
function drawNautilus(u) {
  const t = Date.now() * 0.002;
  ctx.save();
  ctx.translate(u.x, u.y);

  // Spiral shell — drawn with arcs
  ctx.save();
  ctx.rotate(t * 0.3);
  ctx.strokeStyle = '#cc4400';
  ctx.lineWidth = 2;
  for (let i = 0; i < 4; i++) {
    const r = 10 + i * 7;
    ctx.beginPath();
    ctx.arc(0, 0, r, -Math.PI * 0.2, Math.PI * 1.8);
    ctx.stroke();
  }
  ctx.restore();

  // Shell body
  ctx.fillStyle = '#1a0500';
  ctx.beginPath();
  ctx.arc(0, 0, 28, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = '#cc3300';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.arc(0, 0, 28, 0, Math.PI * 2);
  ctx.stroke();

  // Shell stripe pattern
  ctx.strokeStyle = '#552200';
  ctx.lineWidth = 4;
  for (let i = 0; i < 6; i++) {
    ctx.save();
    ctx.rotate(i * Math.PI / 3 + t * 0.2);
    ctx.beginPath();
    ctx.arc(0, 0, 20, -0.3, 0.3);
    ctx.stroke();
    ctx.restore();
  }

  // Eye
  ctx.fillStyle = '#ff4400';
  ctx.beginPath();
  ctx.arc(8, -4, 8, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#000';
  ctx.beginPath();
  ctx.arc(8, -4, 5, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#ff9966';
  ctx.beginPath();
  ctx.arc(9, -5, 2, 0, Math.PI * 2);
  ctx.fill();

  // Tentacles rotating out
  ctx.strokeStyle = '#aa3300';
  ctx.lineWidth = 2;
  for (let i = 0; i < 8; i++) {
    const angle = i * Math.PI / 4 + t * 0.5;
    const ex = Math.cos(angle) * 40;
    const ey = Math.sin(angle) * 40;
    ctx.beginPath();
    ctx.moveTo(Math.cos(angle) * 27, Math.sin(angle) * 27);
    ctx.quadraticCurveTo(ex * 0.6, ey * 0.6 + 12, ex, ey);
    ctx.stroke();
  }

  // Score label
  ctx.fillStyle = '#ff6600';
  ctx.font = 'bold 9px Courier New';
  ctx.textAlign = 'center';
  ctx.fillText('+' + u.pts, 0, 50);

  ctx.restore();
}

// ── Drawing: Coral shields ─────────────────────
function drawCoral(s) {
  if (s.hp <= 0) return;
  ctx.save();
  const ratio = s.hp / s.maxHp;

  // Base rock
  const rr = Math.floor((1 - ratio) * 100 + 30);
  const gg = Math.floor(ratio * 130 + 40);
  const bb = Math.floor(ratio * 80 + 60);
  ctx.fillStyle = `rgb(${rr}, ${gg}, ${bb})`;
  ctx.fillRect(s.x, s.y, s.w, s.h);

  // Rock texture lines
  ctx.strokeStyle = `rgba(0,0,0,0.2)`;
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(s.x + 10, s.y);
  ctx.lineTo(s.x + 8, s.y + s.h);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(s.x + s.w - 14, s.y);
  ctx.lineTo(s.x + s.w - 10, s.y + s.h);
  ctx.stroke();

  // Coral branches growing up from rock
  if (ratio > 0.15) {
    const branchH = s.h * ratio;
    const numBranches = Math.ceil(ratio * 5);
    for (let i = 0; i < numBranches; i++) {
      const bx = s.x + (s.w / (numBranches + 1)) * (i + 1);
      const bh = branchH * (0.5 + Math.sin(i * 1.4 + s.x * 0.05) * 0.4);
      ctx.strokeStyle = `rgb(${rr + 60}, ${gg + 40}, ${bb + 80})`;
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(bx, s.y);
      ctx.lineTo(bx + (i % 2 ? 4 : -4), s.y - bh);
      ctx.stroke();
      // Side branches
      if (ratio > 0.4) {
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(bx + (i % 2 ? 2 : -2), s.y - bh * 0.6);
        ctx.lineTo(bx + (i % 2 ? 10 : -10), s.y - bh * 0.8);
        ctx.stroke();
      }
      // Coral polyp tip
      if (ratio > 0.3) {
        const tipColor = `rgb(${rr + 100}, ${gg + 80}, ${bb + 120})`;
        ctx.fillStyle = tipColor;
        ctx.beginPath();
        ctx.arc(bx + (i % 2 ? 4 : -4), s.y - bh, 3.5, 0, Math.PI * 2);
        ctx.fill();
      }
    }
  }

  // Damage cracks
  if (ratio < 0.65) {
    ctx.strokeStyle = `rgba(0,0,0,${(1 - ratio) * 0.7})`;
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(s.x + 14, s.y + 3);
    ctx.lineTo(s.x + 26, s.y + s.h - 3);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(s.x + s.w - 14, s.y + 5);
    ctx.lineTo(s.x + s.w - 28, s.y + s.h - 2);
    ctx.stroke();
  }
  if (ratio < 0.3) {
    ctx.beginPath();
    ctx.moveTo(s.x + s.w / 2 - 3, s.y + 2);
    ctx.lineTo(s.x + s.w / 2 + 9, s.y + s.h - 2);
    ctx.stroke();
  }

  ctx.restore();
}

// ── Drawing: Sonar bolt (player bullet) ───────
function drawSonarBolt(b) {
  ctx.save();
  // Trail rings (sonar pulse effect)
  for (let i = 0; i < 3; i++) {
    ctx.globalAlpha = 0.8 - i * 0.25;
    ctx.strokeStyle = '#00ffee';
    ctx.lineWidth = 2 - i * 0.5;
    ctx.beginPath();
    ctx.arc(b.x, b.y + i * 6, 3 - i, 0, Math.PI * 2);
    ctx.stroke();
  }
  // Core beam
  ctx.globalAlpha = 1;
  ctx.fillStyle = '#00ffee';
  ctx.fillRect(b.x - 2, b.y, 4, b.h);
  // Leading tip glow
  ctx.fillStyle = '#ffffff';
  ctx.beginPath();
  ctx.arc(b.x, b.y, 3, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

// ── Drawing: Ink bolt (enemy bullet) ──────────
function drawInkBolt(b) {
  ctx.save();
  // Ink splatter blob
  ctx.fillStyle = '#8800cc';
  ctx.globalAlpha = 0.9;
  ctx.beginPath();
  ctx.arc(b.x, b.y, 6, 0, Math.PI * 2);
  ctx.fill();
  // Inner darker core
  ctx.fillStyle = '#440066';
  ctx.beginPath();
  ctx.arc(b.x, b.y, 3.5, 0, Math.PI * 2);
  ctx.fill();
  // Splatter droplets trailing behind
  ctx.fillStyle = 'rgba(150, 0, 220, 0.5)';
  ctx.beginPath();
  ctx.arc(b.x - b.vx * 2, b.y - b.vy * 2, 3, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.arc(b.x + b.vx, b.y - b.vy * 3, 2, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

// ── Drawing: Particles ─────────────────────────
function drawParticles() {
  particles.forEach(p => {
    ctx.save();
    ctx.globalAlpha = Math.max(0, p.a);
    ctx.fillStyle = p.col;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  });
}

// ── Drawing: Seafloor ─────────────────────────
function drawSeafloor() {
  // Rock layer
  ctx.fillStyle = '#001020';
  ctx.fillRect(0, H - 38, W, 38);
  // Sediment texture
  ctx.fillStyle = '#001828';
  ctx.fillRect(0, H - 36, W, 3);
  // Bioluminescent edge glow
  ctx.strokeStyle = 'rgba(0,180,160,0.4)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(0, H - 38);
  ctx.lineTo(W, H - 38);
  ctx.stroke();
  // Little rock bumps
  ctx.fillStyle = '#001828';
  for (let i = 0; i < 12; i++) {
    const rx = (i * 67 + 20) % W;
    const rw = 15 + (i * 13) % 25;
    ctx.beginPath();
    ctx.ellipse(rx, H - 38, rw, 6, 0, 0, Math.PI * 2);
    ctx.fill();
  }
}

// ── Spawn particles ────────────────────────────
function spawnParticles(x, y, col, count) {
  for (let i = 0; i < (count || 10); i++) {
    const angle = Math.random() * Math.PI * 2;
    const spd   = 1 + Math.random() * 4.5;
    particles.push({
      x, y,
      vx: Math.cos(angle) * spd,
      vy: Math.sin(angle) * spd,
      r:  1.5 + Math.random() * 5,
      a:  1,
      col
    });
  }
}

// ── Init ──────────────────────────────────────
function initGame() {
  score = 0; wave = 1; lives = 3;
  player = { x: W / 2, y: H - 70, spd: 5.5, shotCD: 0, inv: 0 };
  bullets = []; inkBolts = []; particles = [];
  ufo = null; ufoTimer = 280 + Math.random() * 300;
  shakePow = 0; waveBanner = null;
  initWave(true);
  updateHUD();
}

function initWave(resetPlayer) {
  const COLS = 11, ROWS = 5;
  const eW = 46, eH = 42;
  const startX = (W - COLS * eW) / 2 + eW / 2;
  const startY = 62;
  creatures = [];
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const type = r < 2 ? 'angler' : r < 4 ? 'jelly' : 'crab';
      const pts  = type === 'angler' ? 30 : type === 'jelly' ? 20 : 10;
      creatures.push({
        x: startX + c * eW,
        y: startY + r * eH,
        w: 36, h: 30,
        type, pts,
        alive: true,
        animT: Math.random() * 100
      });
    }
  }
  creDir        = 1;
  creSpeed      = 0.5 + wave * 0.16;
  creShootTimer = 55;
  bullets       = [];
  inkBolts      = [];
  particles     = [];
  ufo           = null;
  ufoTimer      = 280 + Math.random() * 350;
  shakePow      = 0;
  waveBanner    = null;

  // Coral shields
  corals = [];
  for (let i = 0; i < 4; i++) {
    const sw = 62, sh = 28;
    corals.push({
      x: W * (i + 1) / 5 - sw / 2,
      y: H - 152,
      w: sw, h: sh,
      hp: 14, maxHp: 14
    });
  }

  if (resetPlayer && player) player.x = W / 2;
}

// ── HUD ───────────────────────────────────────
function updateHUD() {
  scEl.textContent = score.toLocaleString();
  wvEl.textContent = wave;
  bsEl.textContent = best.toLocaleString();
  let h = '';
  for (let i = 0; i < lives; i++) h += '&#9670;';
  lvEl.innerHTML = h || '&#10005;';
}

// ── Update ────────────────────────────────────
function update(dt) {
  if (state !== 'playing') return;

  // Player movement
  if (keys['ArrowLeft']  || keys['a'] || mob.l) player.x = Math.max(32, player.x - player.spd * dt);
  if (keys['ArrowRight'] || keys['d'] || mob.r) player.x = Math.min(W - 32, player.x + player.spd * dt);

  // Shoot
  player.shotCD -= dt;
  if ((keys[' '] || keys['ArrowUp'] || mob.f) && player.shotCD <= 0) {
    bullets.push({ x: player.x, y: player.y - 42, vy: -11, w: 4, h: 18 });
    player.shotCD = 14;
  }

  if (player.inv > 0) player.inv -= dt;

  // Move bullets
  bullets   = bullets.filter(b => { b.y += b.vy * dt; return b.y > -25; });
  inkBolts  = inkBolts.filter(b => {
    b.x += b.vx * dt;
    b.y += b.vy * dt;
    return b.y < H + 15 && b.x > -15 && b.x < W + 15;
  });

  // Nautilus UFO
  ufoTimer -= dt;
  if (!ufo && ufoTimer <= 0) {
    ufo = { x: -45, y: 56, vx: 2.5 + wave * 0.12, pts: 200 + wave * 75 };
    ufoTimer = 300 + Math.random() * 400;
  }
  if (ufo) { ufo.x += ufo.vx * dt; if (ufo.x > W + 60) ufo = null; }

  // Animate creatures
  creatures.forEach(e => { if (e.alive) e.animT += dt; });

  // Move creature formation
  const alive = creatures.filter(e => e.alive);
  if (alive.length === 0) {
    wave++;
    waveBanner = { timer: 95 };
    initWave(false);
    updateHUD();
    return;
  }

  let minX = Infinity, maxX = -Infinity, maxY = -Infinity;
  alive.forEach(e => {
    minX = Math.min(minX, e.x - e.w / 2);
    maxX = Math.max(maxX, e.x + e.w / 2);
    maxY = Math.max(maxY, e.y + e.h / 2);
  });

  let drop = false;
  if (maxX >= W - 8 && creDir > 0) { drop = true; creDir = -1; }
  if (minX <= 8     && creDir < 0) { drop = true; creDir =  1; }

  creatures.forEach(e => {
    if (!e.alive) return;
    if (drop) e.y += 16;
    e.x += creSpeed * creDir * dt;
  });

  // Invasion reach
  if (maxY >= H - 116) { killPlayer(); return; }

  // Enemy shooting
  creShootTimer -= dt;
  if (creShootTimer <= 0 && alive.length > 0) {
    const shooter = alive[Math.floor(Math.random() * alive.length)];
    const spreads = wave >= 4 ? [-0.42, 0, 0.42] : wave >= 2 ? [-0.28, 0.28] : [0];
    spreads.forEach(a => {
      inkBolts.push({
        x: shooter.x, y: shooter.y + 20,
        vx: Math.sin(a) * 3.5,
        vy: 3.5 + wave * 0.32,
        w: 8, h: 14
      });
    });
    creShootTimer = Math.max(26 - wave * 2.2, 9) + Math.random() * 16;
  }

  // Sonar bolts vs creatures
  bullets = bullets.filter(b => {
    for (let e of creatures) {
      if (!e.alive) continue;
      if (b.x > e.x - e.w / 2 && b.x < e.x + e.w / 2 &&
          b.y > e.y - e.h / 2 && b.y < e.y + e.h / 2) {
        e.alive = false;
        score += e.pts;
        best = Math.max(best, score);
        localStorage.setItem('dss_best', best);
        const col = e.type === 'angler' ? '#ff44ff' : e.type === 'jelly' ? '#00aaff' : '#ff6600';
        spawnParticles(e.x, e.y, col, 12);
        shakePow = 4;
        updateHUD();
        return false;
      }
    }
    return true;
  });

  // Sonar bolts vs nautilus UFO
  if (ufo) {
    bullets = bullets.filter(b => {
      if (Math.abs(b.x - ufo.x) < 32 && Math.abs(b.y - ufo.y) < 32) {
        score += ufo.pts;
        best = Math.max(best, score);
        localStorage.setItem('dss_best', best);
        spawnParticles(ufo.x, ufo.y, '#ff6600', 18);
        shakePow = 10;
        ufo = null;
        updateHUD();
        return false;
      }
      return true;
    });
  }

  // Sonar bolts vs coral
  bullets = bullets.filter(b => {
    for (let s of corals) {
      if (s.hp <= 0) continue;
      if (b.x > s.x && b.x < s.x + s.w && b.y > s.y && b.y < s.y + s.h) {
        s.hp--;
        spawnParticles(b.x, b.y, '#00ccaa', 3);
        return false;
      }
    }
    return true;
  });

  // Ink bolts vs coral
  inkBolts = inkBolts.filter(b => {
    for (let s of corals) {
      if (s.hp <= 0) continue;
      if (b.x > s.x && b.x < s.x + s.w && b.y > s.y && b.y < s.y + s.h) {
        s.hp = Math.max(0, s.hp - 1);
        return false;
      }
    }
    return true;
  });

  // Ink bolts vs player
  if (player.inv <= 0) {
    for (let b of inkBolts) {
      if (b.x > player.x - 26 && b.x < player.x + 26 &&
          b.y > player.y - 40 && b.y < player.y + 18) {
        killPlayer();
        return;
      }
    }
  }

  // Update particles
  particles = particles.filter(p => {
    p.x  += p.vx * dt;
    p.y  += p.vy * dt;
    p.vy += 0.1 * dt;
    p.a  -= dt * 0.022;
    return p.a > 0;
  });

  // Decay shake
  if (shakePow > 0) shakePow = Math.max(0, shakePow - dt * 0.55);

  // Wave banner
  if (waveBanner) { waveBanner.timer -= dt; if (waveBanner.timer <= 0) waveBanner = null; }
}

// ── Kill player ────────────────────────────────
function killPlayer() {
  spawnParticles(player.x, player.y - 20, '#00ffee', 18);
  shakePow = 18;
  lives--;
  inkBolts = [];
  updateHUD();
  if (lives <= 0) {
    state = 'dead';
    setTimeout(showGameOver, 1000);
  } else {
    player.x  = W / 2;
    player.inv = 130;
  }
}

// ── Draw frame ────────────────────────────────
function draw(ts) {
  ctx.save();

  // Screen shake transform
  if (shakePow > 0) {
    ctx.translate(
      (Math.random() - 0.5) * shakePow * 1.2,
      (Math.random() - 0.5) * shakePow * 1.2
    );
  }

  ctx.clearRect(-30, -30, W + 60, H + 60);

  // Background layers
  drawOceanBg(ts);

  // Coral shields
  corals.forEach(s => drawCoral(s));

  // Creatures (Space Invader formation)
  creatures.forEach(e => {
    if (!e.alive) return;
    if      (e.type === 'angler') drawAnglerfish(e.x, e.y, e.animT);
    else if (e.type === 'jelly')  drawJellyfish(e.x, e.y, e.animT);
    else                          drawCrab(e.x, e.y, e.animT);
  });

  // Nautilus UFO boss
  if (ufo) drawNautilus(ufo);

  // Player submarine
  if (state === 'playing') drawSub(player.x, player.y);

  // Projectiles
  bullets.forEach(b   => drawSonarBolt(b));
  inkBolts.forEach(b  => drawInkBolt(b));

  // Particles
  drawParticles();

  // Sea floor
  drawSeafloor();

  // Wave banner
  if (waveBanner) {
    const a = waveBanner.timer > 55 ? 1 : waveBanner.timer / 55;
    ctx.save();
    ctx.globalAlpha = a;
    ctx.fillStyle   = '#00ffee';
    ctx.font        = "bold 18px 'Courier New'";
    ctx.textAlign   = 'center';
    ctx.fillText('WAVE ' + wave, W / 2, H / 2);
    ctx.fillStyle = '#0099cc';
    ctx.font      = "11px 'Courier New'";
    ctx.fillText('CREATURES DESCENDING', W / 2, H / 2 + 30);
    ctx.restore();
  }

  ctx.restore();
}

// ── Game loop ─────────────────────────────────
function loop(ts) {
  const dt = Math.min((ts - lastT) / 16.667, 3);
  lastT = ts;
  update(dt);
  draw(ts);
  frameId = requestAnimationFrame(loop);
}

// ── Screens ───────────────────────────────────
function startGame() {
  ov.classList.add('gone');
  state = 'playing';
  initGame();
  cancelAnimationFrame(frameId);
  lastT  = performance.now();
  frameId = requestAnimationFrame(loop);
}

function showGameOver() {
  const isRecord = score >= best && score > 0;
  ov.classList.remove('gone');
  ov.innerHTML = `
    <div class="ot" style="font-size:22px;color:#ff4400;text-shadow:0 0 20px #ff4400">
      HULL BREACHED
    </div>
    <div class="os" style="color:#ff6600;font-size:9px">
      The abyss has consumed your vessel.
    </div>
    <div class="sbox">
      <p>FINAL SCORE</p>
      <p class="big">${score.toLocaleString()}</p>
      <p style="margin-top:8px">WAVE REACHED &nbsp;${wave} &nbsp;|&nbsp; BEST &nbsp;${best.toLocaleString()}</p>
      ${isRecord ? '<p class="nr">&#9733; DEPTH RECORD &#9733;</p>' : ''}
    </div>
    <div class="oh" style="margin-top:8px">Can the submarine survive deeper?</div>
    <button id="go" onclick="startGame()" style="margin-top:16px;padding:13px 36px;background:#00e5cc;color:#000814;font-family:Courier New,monospace;font-size:13px;border:none;cursor:pointer;letter-spacing:3px;font-weight:700;">
      DIVE AGAIN
    </button>
  `;
}

// ── Keyboard input ────────────────────────────
window.addEventListener('keydown', e => {
  keys[e.key] = true;
  if (e.key === ' ') e.preventDefault();
  if ((e.key === 'Enter' || e.key === ' ') && state === 'idle') startGame();
});
window.addEventListener('keyup', e => { keys[e.key] = false; });

// ── Mobile controls ───────────────────────────
function bindBtn(id, key) {
  const el = document.getElementById(id);
  if (!el) return;
  el.addEventListener('touchstart', e => { e.preventDefault(); mob[key] = true; }, { passive: false });
  el.addEventListener('touchend',   e => { e.preventDefault(); mob[key] = false; }, { passive: false });
  el.addEventListener('mousedown',  () => mob[key] = true);
  el.addEventListener('mouseup',    () => mob[key] = false);
  el.addEventListener('mouseleave', () => mob[key] = false);
}
bindBtn('ml', 'l');
bindBtn('mr', 'r');
bindBtn('mf', 'f');

// ── Start button ──────────────────────────────
document.getElementById('go').addEventListener('click', startGame);
window.startGame = startGame;

// Update best score display on load
bsEl.textContent = best.toLocaleString();

// Idle animation loop
frameId = requestAnimationFrame(function idleLoop(ts) {
  if (state !== 'idle') return;
  ctx.clearRect(0, 0, W, H);
  drawOceanBg(ts);
  drawSeafloor();
  frameId = requestAnimationFrame(idleLoop);
});
</script>
